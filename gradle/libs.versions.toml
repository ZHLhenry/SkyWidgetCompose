[versions]
skyBuildLogic = "1.2.3"
skymvi = "1.0.1"
skyWidgetCompose = "1.0.4"
activityCompose = "1.13.0"
lottieCompose = "6.7.1"
pagingCompose = "3.3.6"
hiltLifecycleViewModelCompose = "1.4.0"
camerax = "1.4.0"
xlog = "1.11.1"
zxing = "3.5.4"

[libraries]
# 必须库
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# 非必须库
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
lottie-compose = { group = "com.airbnb.android", name = "lottie-compose", version.ref = "lottieCompose" }
skyWidgetCompose = { module = "com.sky.lib:SkyWidgetCompose", version.ref = "skyWidgetCompose" }
androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "pagingCompose" }

androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
xlog = { module = "com.elvishew:xlog", version.ref = "xlog" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

skymvi = { module = "com.sky.lib:SkyMVI", version.ref = "skymvi" }
hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "hiltLifecycleViewModelCompose" }

[plugins]
# 必须插件
sky-android-application = { id = "sky.android.application", version.ref = "skyBuildLogic" }
sky-android-application-flavors = { id = "sky.android.application.flavors", version.ref = "skyBuildLogic" }
sky-android-library = { id = "sky.android.library", version.ref = "skyBuildLogic" }
sky-android-hilt = { id = "sky.android.hilt", version.ref = "skyBuildLogic" }
sky-android-publish = { id = "sky.android.publish", version.ref = "skyBuildLogic" }

